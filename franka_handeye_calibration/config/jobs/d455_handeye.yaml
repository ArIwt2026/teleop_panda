job_name: d455_handeye
sequence_name: camcalib
eye_in_hand: true
image_topic: /camera_front/camera_front/color/image_raw
camera_info_topic: /camera_front/camera_front/color/camera_info
robot_state_topic: /franka_robot_state_broadcaster/robot_state
joint_state_topic: /joint_states
intrinsics_path: ""
fk_service_name: /compute_fk
fk_link_name: panda_hand_tcp
robot_pose_source: robot_state
robot_base_frame: panda_link0
board:
  squares_x: 7
  squares_y: 10
  square_length_m: 0.038
  marker_length_m: 0.0225
  dictionary_name: DICT_6X6_250
settle_time_sec: 2.0
min_corners: 3
required_min_samples: 6
skip_steps: [1, 8]
max_retries_per_point: 3
skip_failed_points: false
retry_backoff_sec: 1.0
output_root: calibration_data/handeye
executor_namespace: ""
reject_on_fk_mismatch: true
max_fk_translation_error_m: 0.02
max_fk_rotation_error_deg: 5.0
freshness:
  image_max_age_sec: 1.0
  camera_info_max_age_sec: 1.0
  robot_state_max_age_sec: 1.0
  joint_state_max_age_sec: 1.0
