services:
  panda_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: teleop_panda:latest
    container_name: panda_monitor
    restart: "no"
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_LOG_DIR=/workspace/src/teleop_panda/log
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /dev:/dev
      - ../cyclonedds.xml:/config/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >-
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /workspace/install/setup.bash &&
      exec ros2 launch franka_bringup panda_camera_monitor.launch.py
      robot_ip:=172.16.0.2"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
