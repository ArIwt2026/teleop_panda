services:
  panda_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: teleop_panda:latest
    container_name: panda_monitor
    restart: "no"
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    # Franka FCI runs a 1 kHz loop. Match the vendor's RT-priority and
    # locked-memory limits inside the container; privileged grants SYS_NICE.
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 104857600
        hard: 104857600
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_LOG_DIR=/workspace/src/teleop_panda/log
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
    volumes:
      - /dev:/dev
      - ./franka_ros2/franka_bringup/config/controllers.yaml:/workspace/install/franka_bringup/share/franka_bringup/config/controllers.yaml:ro
      - ./install/admittance_controller:/workspace/install/admittance_controller:ro
      - ../cyclonedds.xml:/config/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/iwtros/Documents/ar:/home/iwtros/Documents/ar:rw
    command: >-
      bash -lc "sysctl -w net.core.rmem_max=8388608 &&
      source /opt/ros/humble/setup.bash &&
      source /workspace/install/setup.bash &&
      exec ros2 launch franka_bringup panda_camera_monitor.launch.py
      robot_ip:=172.16.0.2"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
